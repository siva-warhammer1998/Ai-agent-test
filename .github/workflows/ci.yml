name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  required-check:
    name: Required Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository guidance
        run: test -f AGENTS.md && test -f agents/build-agent.md
